[workspace]
resolver = "2"
members = [
    "packages/core",
    "packages/desktop/src-tauri",
    "packages/shim",
]

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
# LOAD-BEARING, and Cargo's default, stated so it is not changed by accident: a release build is
# locked to the production Environment because everything that can choose another is compiled only
# under `debug_assertions` (packages/core/src/environment.rs, issue #786).
debug-assertions = false
