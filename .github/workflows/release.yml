name: Release

# D-182: this workflow is the only sanctioned way a Flywheel release is published, and a tag is the
# only thing that starts it. There is deliberately no workflow_dispatch with a typed version: D-184
# rejected it as trivially desynced from the tag and the changelog.
#
# THIS WORKFLOW BUILDS NO .dmg. The installer on a release is Apple-signed with a Developer ID and
# notarised, and it is built, signed and notarised elsewhere, on a machine that holds the signing
# credentials (a public workflow must hold none). That build is checked on a clean Mac and put on this
# release's DRAFT, with its checksum, BEFORE the tag that starts this workflow exists (the `v*` tag below is
# pushed only after the upload). So this workflow works from what it finds on the draft: it refuses a draft
# that carries anything else, checks that the .dmg is signed, notarised and stapled and that nothing in it
# would fail to load, adds the release notes and the SBOM, attests the files and publishes. A tag with no
# such draft publishes nothing, and no step here can put an unsigned .dmg on a release.
# WHAT THE ATTESTATION THEREFORE SAYS: it is a signed record that this workflow, from this tag, published
# exactly these files. It is not a record that this workflow built them; the Apple signature and the
# notarisation ticket inside the .dmg are what tie it to its builder. README.md's "Verifying a download"
# is how a user checks the result.
#
# The `v*` tag is pushed by the private monorepo's export (a `flywheel-v*` tag there becomes `v*`
# here, at the commit exported from it), never by hand, and only once that commit is on `main`.
# Both jobs run on the same pinned actions as ci.yml, every action at a full commit SHA.
#
# TWO JOBS, SO THE ONE THAT ATTESTS RUNS NOTHING IT DID NOT HAVE TO. `release` finds and checks the draft
# and leaves the notes and the SBOM on it; it runs this repository's scripts and Apple's tools, and holds
# only `contents: write`. `attest` downloads the draft's assets, attests them with GitHub artifact
# attestations (SLSA build provenance for every asset, the SBOM for the app's), checks those attestations
# verify, and only then publishes. It runs GitHub's own actions and `gh`, with no checkout, so the OIDC
# token that signs (`id-token: write`) is never in a job where third-party code runs.

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  release:
    runs-on: macos-15
    permissions:
      # Writing the draft's name, body and SBOM. It never publishes: `attest` does.
      contents: write
    outputs:
      release-id: ${{ steps.draft.outputs.id }}
    # Bounded: the notes, the SBOM and a mount of the .dmg, a few minutes; not yet observed on a release.
    timeout-minutes: 25
    env:
      TAG: ${{ github.ref_name }}
    steps:
      # fetch-depth 0: the gate below reads main.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      # A release is published only from a commit ci.yml passed. `main` holds nothing else (it moves
      # only by the export's fast-forward just before this tag, and its ruleset requires `build` on
      # the pushed commit), so "the tag is on main" is that statement, read from git rather than from a status API.
      - name: The tagged commit passed CI (it is on main)
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main, so ci.yml has not passed on it. Not releasing."
            exit 1
          fi

      # First, before any toolchain is installed: a malformed tag fails here and writes nothing.
      - name: Stamp the tag as the version
        run: node scripts/release/apply-tag-version.mjs "$TAG"

      # The release body is CHANGELOG.md's section for the tag, written in the changes that made
      # it, in a user's words; the commit subjects it replaced were written for developers. Here,
      # before anything is read from the draft: a tag whose version has no section with an entry
      # fails and changes nothing. A release is prepared by moving the Unreleased entries under its version.
      # D-205: the first-run workaround follows the notes, one blank line between them. It is
      # written into the body here, so the release is created complete and nothing edits the page
      # after it is published.
      - name: Release notes from the changelog
        run: |
          node scripts/release/changelog-notes.mjs "$TAG" > release-notes.md
          printf '%s\n\n%s\n' "$(cat release-notes.md)" "$(cat .github/release-install-note.md)" > release-body.md

      # No cache: nothing is installed here, and nothing restored from a cache another ref wrote may reach a
      # job that publishes.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          package-manager-cache: false

      # THE SBOM, CycloneDX, from the committed lockfiles (the version just stamped included) and
      # nothing a build step wrote, since nothing is built here. Two catalogers and no others:
      # Cargo.lock (the app, the core crate and flywheel-shim) and the two package-lock.json files
      # (the sidecar and the bundled frontend; syft leaves dev dependencies out of a lockfile by
      # default). The default set would also list this repository's workflow actions, which publish
      # the release and are not in it; the publication is described by the provenance attestation.
      # The Node runtime the bundle carries is in no lockfile, so sbom-add-runtime.mjs adds it from
      # stage-runtime.mjs's pin. syft is installed by install-action, which checks its checksum.
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: syft@1.55.0

      - name: SBOM (CycloneDX) from the lockfiles
        id: sbom
        run: |
          version="${TAG#v}"
          sbom="$RUNNER_TEMP/sbom/Flywheel_${version}.cdx.json"
          mkdir -p "$RUNNER_TEMP/sbom"
          syft scan dir:. --source-name Flywheel --source-version "$version" \
            --override-default-catalogers rust-cargo-lock-cataloger \
            --override-default-catalogers javascript-lock-cataloger \
            --output "cyclonedx-json=$sbom"
          node scripts/release/sbom-add-runtime.mjs "$sbom"
          n=$(jq '.components | length' "$sbom")
          echo "SBOM: $n components"
          # A cataloger that silently read nothing would still write a valid, near-empty BOM.
          for purl in 'pkg:cargo/' 'pkg:npm/' 'pkg:generic/node@'; do
            jq -e --arg p "$purl" 'any(.components[]; (.purl // "") | startswith($p))' "$sbom" >/dev/null ||
              { echo "::error::the SBOM has no component whose purl starts $purl"; exit 1; }
          done
          echo "path=$sbom" >> "$GITHUB_OUTPUT"

      # THE DRAFT IS WHAT THIS RELEASE PUBLISHES, AND IT EXISTS BEFORE THIS RUN. This repository's
      # releases are immutable: once a release is published GitHub locks its assets and its tag, so
      # everything is put on a draft first and the draft is published once, by `attest`. The draft is the
      # one whose tag is this tag, found by listing the releases (GET .../releases/tags/{tag} does not
      # answer for a draft). `pick` refuses a release already published, no draft, and two drafts;
      # `check` refuses a draft that carries anything but the signed .dmg, its checksum and (from an earlier
      # failed run) the SBOM, or an asset not in state "uploaded" (an interrupted upload leaves "starter").
      - name: Find the draft and check what is on it
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq -s 'add // []')
          id=$(node scripts/release/draft-assets.mjs pick "$TAG" <<<"$releases")
          gh api "repos/$GITHUB_REPOSITORY/releases/$id" | node scripts/release/draft-assets.mjs check "${TAG#v}"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      # The installer and its checksum, downloaded from the draft by asset id: these are the bytes a user
      # downloads. An asset's name becomes a path here. GitHub's asset names have no slash; this holds it.
      - name: Download the installer from the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: |
          set -euo pipefail
          mkdir signed
          while read -r id name; do
            [[ "$name" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::unexpected asset name: $name"; exit 1; }
            case "$name" in
              *.dmg | *.dmg.sha256)
                gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "signed/$name" ;;
            esac
          done < <(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" | jq -r '.assets[] | "\(.id) \(.name)"')
          shasum -a 256 signed/*

      # SIGNED, NOTARISED, STAPLED, OR NOTHING IS PUBLISHED. This asks the questions a user's Mac asks (the
      # checksum, Gatekeeper, the notarisation tickets, the signature, the hardened runtime), from a clean
      # hosted Mac. A failure ends this job, so `attest` never runs and the draft is never published.
      - name: The installer is signed, notarised and stapled
        run: node scripts/release/check-signed-dmg.mjs "signed/Flywheel_${TAG#v}_aarch64.dmg"

      # LOCKED TO PRODUCTION (issue #786), AND EVERY MACH-O WOULD LOAD, on the app inside the .dmg that
      # ships. The built app must hold no non-production Environment (`highknow.dev`) and no Environment
      # picker; both are compiled out of a release build, and this reads the bytes that ship. The renderer
      # is embedded compressed in the binary, so the build that made this .dmg scanned it as `dist` as well
      # (scripts/release/check-release-bundle.mjs); only the app can be read here. The Mach-O check walks every
      # Mach-O in it, whatever a dependency added. A failure ends this job and the draft is never published.
      - name: The bundle is locked to production, and every Mach-O in it would load
        run: |
          set -euo pipefail
          mnt=$(mktemp -d "${TMPDIR:-/tmp}/flywheel-dmg.XXXXXX")
          hdiutil attach "signed/Flywheel_${TAG#v}_aarch64.dmg" -nobrowse -readonly -mountpoint "$mnt" -quiet
          trap 'hdiutil detach "$mnt" -quiet' EXIT
          node scripts/release/check-release-bundle.mjs "$mnt/Flywheel.app"
          node scripts/release/check-macho.mjs "$mnt/Flywheel.app"

      # The page's name and body, written once the installer has passed. Only now: nothing is changed on
      # a draft whose installer was refused.
      - name: Write the release page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -f name="Flywheel $TAG" -F body=@release-body.md --silent

      # A failed run leaves its draft and the next run reuses it (see above), so an SBOM of this
      # name may already be on it: it is replaced, not refused as a duplicate. Uploaded to GitHub's
      # uploads host, by the draft's id.
      - name: Attach the SBOM to the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
          SBOM: ${{ steps.sbom.outputs.path }}
        run: |
          name=$(basename "$SBOM")
          while read -r id; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"
          done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" |
            jq -r --arg n "$name" '.[] | select(.name == $n) | .id')
          gh api --method POST -H 'Content-Type: application/json' --input "$SBOM" --silent \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$name"

  attest:
    needs: release
    runs-on: ubuntu-latest
    # Bounded: two bundle downloads, two attestation calls and their verification, about a
    # minute in all; not yet observed on a release.
    timeout-minutes: 15
    env:
      TAG: ${{ github.ref_name }}
    permissions:
      # Reading the draft's assets, and publishing it.
      contents: write
      # The OIDC token Sigstore exchanges for the short-lived certificate that signs.
      id-token: write
      # Storing the attestations in this repository's attestations API.
      attestations: write
    steps:
      # WHAT IS ATTESTED IS WHAT IS ON THE DRAFT, downloaded from it rather than handed over by the
      # previous job, so the digests are those of the files a user downloads. First, before
      # downloading anything: the release is still a draft, and it carries EXACTLY the signed .dmg, its
      # checksum and the SBOM, every one in state "uploaded" (an interrupted upload leaves one in state
      # "starter"). Read by id: GET .../releases/tags/{tag} does not answer for a draft. The SBOM goes to
      # its own directory, so the SBOM attestation's subjects are the app's assets and not the SBOM itself.
      # The checksum is then checked against the .dmg that was downloaded: the file attested is the file the
      # `release` job's checks were about.
      - name: Assert and download the draft's assets
        id: assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.release.outputs.release-id }}
        run: |
          RELEASE=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")
          if [ "$(jq -r .draft <<<"$RELEASE")" != true ]; then
            echo "::error::Release $RELEASE_ID is already published, so its assets cannot change. Not releasing again."
            exit 1
          fi
          if [ "$(jq '[.assets[] | select(.state != "uploaded")] | length' <<<"$RELEASE")" -ne 0 ]; then
            echo "::error::the draft carries an asset that is not in state uploaded."
            exit 1
          fi
          VERSION="${TAG#v}"
          NAMES=$(jq -r '.assets[].name' <<<"$RELEASE" | sort)
          echo "$NAMES"
          WANT=$(printf '%s\n' "Flywheel_${VERSION}_aarch64.dmg" "Flywheel_${VERSION}_aarch64.dmg.sha256" "Flywheel_${VERSION}.cdx.json" | sort)
          if [ "$NAMES" != "$WANT" ]; then
            echo "::error::the draft must carry exactly the signed .dmg, its checksum and the SBOM; it carries the files above."
            exit 1
          fi
          mkdir -p assets sbom
          while read -r id name; do
            # An asset's name becomes a path here. GitHub's asset names have no slash; this holds it.
            [[ "$name" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::unexpected asset name: $name"; exit 1; }
            case "$name" in
              *.cdx.json) dir=sbom; echo "sbom=sbom/$name" >> "$GITHUB_OUTPUT" ;;
              *) dir=assets ;;
            esac
            gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "$dir/$name"
          done < <(jq -r '.assets[] | "\(.id) \(.name)"' <<<"$RELEASE")
          sha256sum assets/* sbom/*
          (cd assets && sha256sum -c "Flywheel_${VERSION}_aarch64.dmg.sha256")

      # SLSA build provenance for every asset, the SBOM included, so `gh attestation verify <file>`
      # answers for any file on the release page.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            assets/*
            sbom/*

      # The SBOM, attested as describing the app's assets (predicate type
      # https://cyclonedx.org/bom). actions/attest rather than actions/attest-sbom: attest-sbom v4 is
      # deprecated, a wrapper that passes these same inputs to actions/attest and warns on every run.
      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: assets/*
          sbom-path: ${{ steps.assets.outputs.sbom }}

      # Nothing is public until the attestations verify, read back from GitHub with the command
      # README.md gives a user, and held tighter: signed by this workflow, from this tag.
      - name: Verify the attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          signer="$GITHUB_REPOSITORY/.github/workflows/release.yml"
          for f in assets/* sbom/*; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$signer" --source-ref "$GITHUB_REF"
          done
          for f in assets/*; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$signer" --source-ref "$GITHUB_REF" \
              --predicate-type https://cyclonedx.org/bom
          done

      # The one step that publishes. `make_latest` is stated rather than left to the default, so
      # the repository's latest-release link points at this release.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.release.outputs.release-id }}
        run: gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -f make_latest=true --silent

      # Do not trust the API's own success: read back what was actually published, by its tag,
      # which answers only for a published release. `immutable` is printed, not required: the
      # setting belongs to the repository rather than to this workflow, and is asserted where it
      # is managed. A release published before the setting is on is still a complete release.
      - name: Assert the published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          RELEASE=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")
          if [ "$(jq -r .draft <<<"$RELEASE")" != false ]; then
            echo "::error::$TAG is still a draft after publishing."
            exit 1
          fi
          NAMES=$(jq -r '.assets[] | select(.state == "uploaded") | .name' <<<"$RELEASE")
          echo "$NAMES"
          need() { echo "$NAMES" | grep -Eq "$1" || { echo "MISSING release asset matching: $1" >&2; exit 1; }; }
          need '\.dmg$'
          need '\.dmg\.sha256$'
          need '\.cdx\.json$'
          echo "immutable: $(jq -r .immutable <<<"$RELEASE")"
