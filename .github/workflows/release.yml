name: Release

# D-182: this workflow is the only sanctioned way a Flywheel binary comes into existence, and a
# tag is the only thing that starts it. There is deliberately no workflow_dispatch with a typed
# version: D-184 rejected it as trivially desynced from the tag and the changelog.
# The build steps are ci.yml's, in the same order, so a release is itself a clean-clone build.
#
# The `v*` tag is pushed by the private monorepo's export (a `flywheel-v*` tag there becomes `v*`
# here, at the commit exported from it), never by hand, and only once that commit is on `main`.
# Same runner and same pinned actions as ci.yml: macOS 15, every action at a full commit SHA.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    # Bounded: observed 8.9 min (one run).
    timeout-minutes: 25
    steps:
      # fetch-depth 0: the gate below reads main.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      # A release is built only from a commit ci.yml passed. `main` holds nothing else (it moves
      # only by ci.yml's fast-forward after a green run, and its ruleset requires `build`), so
      # "the tag is on main" is that statement, read from git rather than from a status API. It
      # replaces re-running the sidecar and workspace tests here: they passed on this very commit.
      - name: The tagged commit passed CI (it is on main)
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main, so ci.yml has not passed on it. Not releasing."
            exit 1
          fi

      # First, before any toolchain is installed: a malformed tag fails here and writes nothing.
      - name: Stamp the tag as the version
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release/apply-tag-version.mjs "$TAG"

      # The release body is CHANGELOG.md's section for the tag, written in the changes that made
      # it, in a user's words; the commit subjects it replaced were written for developers. Here,
      # before any toolchain: a tag whose version has no section with an entry fails and builds
      # nothing. A release is prepared by moving the Unreleased entries under its version.
      # D-205: the first-run workaround follows the notes, one blank line between them. It is
      # written into the body here, so the release is created complete and nothing edits the page
      # after it is published.
      - name: Release notes from the changelog
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node scripts/release/changelog-notes.mjs "$TAG" > release-notes.md
          printf '%s\n\n%s\n' "$(cat release-notes.md)" "$(cat .github/release-install-note.md)" > release-body.md
          {
            echo 'body<<NOTES_EOF'
            cat release-body.md
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      # CACHES ON A RELEASE, AND WHY zizmor's cache-poisoning FINDING IS IGNORED ON BOTH. A tag run
      # restores only entries its own ref or the default branch wrote; a fork's pull request writes
      # to its own merge ref, which no tag run can read. So every entry here was written by a run
      # of code already pushed to this repository's branches by the export, which is the access a
      # release needs anyway. Without the two caches this build is a cold Rust compile on macOS,
      # several times the observed 8.9 min; npm still checks every package against the lockfile.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 # zizmor: ignore[cache-poisoning] see "CACHES ON A RELEASE" above
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/desktop/package-lock.json
            packages/sidecar/package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # 2026-10-16, the stable branch (it has no release tags)

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3 # zizmor: ignore[cache-poisoning] see "CACHES ON A RELEASE" above

      - run: npm --prefix packages/sidecar ci

      - run: npm --prefix packages/desktop ci

      # Staging MUST precede every cargo step. tauri_build::build() fails the whole workspace
      # build when a bundle.externalBin file is missing, so a fresh clone cannot compile or test
      # until the three binaries/flywheel-* files exist.
      - run: npm --prefix packages/sidecar run build:dist

      # A DRAFT FIRST, PUBLISHED ONLY ONCE EVERY ASSET IS ON IT. This repository's releases are
      # immutable: once a release is published GitHub locks its assets and its tag, so an asset
      # uploaded after publication is refused and the release ships without it. GitHub's guidance
      # for immutable releases is to create the release as a draft, attach every asset, then
      # publish. With `releaseDraft: true`, tauri-action v0.6.2 creates the release as a draft (or
      # reuses the draft a failed run left for this tag), uploads the bundles to it, and outputs
      # its `releaseId`; it never publishes. The "Publish the release" step below does. A new
      # asset (an SBOM, an attestation) is uploaded to the same draft, by that id, before the
      # draft's assets are asserted.
      #
      # Not Apple-signed on purpose (D-185): nothing but criterion 1 waits on an Apple account.
      # Env group added later, NOT here:
      #   the Apple signing and notarization set  -> plan 11-07
      - id: tauri
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: packages/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Flywheel ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: --target aarch64-apple-darwin

      # Before publishing, so a missing asset leaves an unpublished draft and nothing public. Read
      # by id: GET .../releases/tags/{tag} does not answer for a draft. Only assets in state
      # "uploaded" count; an interrupted upload leaves one in state "starter".
      - name: Assert the draft's assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
        run: |
          RELEASE=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")
          if [ "$(jq -r .draft <<<"$RELEASE")" != true ]; then
            echo "::error::Release $RELEASE_ID is already published, so its assets cannot change. Not releasing again."
            exit 1
          fi
          NAMES=$(jq -r '.assets[] | select(.state == "uploaded") | .name' <<<"$RELEASE")
          echo "$NAMES"
          need() { echo "$NAMES" | grep -Eq "$1" || { echo "MISSING release asset matching: $1" >&2; exit 1; }; }
          need '\.dmg$'

      # The one step that publishes. `make_latest` is stated rather than left to the default, so
      # the repository's latest-release link points at this release.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
        run: gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -f make_latest=true --silent

      # Do not trust the API's own success: read back what was actually published, by its tag,
      # which answers only for a published release. `immutable` is printed, not required: the
      # setting belongs to the repository rather than to this workflow, and is asserted where it
      # is managed. A release published before the setting is on is still a complete release.
      - name: Assert the published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          RELEASE=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")
          if [ "$(jq -r .draft <<<"$RELEASE")" != false ]; then
            echo "::error::$TAG is still a draft after publishing."
            exit 1
          fi
          NAMES=$(jq -r '.assets[] | select(.state == "uploaded") | .name' <<<"$RELEASE")
          echo "$NAMES"
          need() { echo "$NAMES" | grep -Eq "$1" || { echo "MISSING release asset matching: $1" >&2; exit 1; }; }
          need '\.dmg$'
          echo "immutable: $(jq -r .immutable <<<"$RELEASE")"
