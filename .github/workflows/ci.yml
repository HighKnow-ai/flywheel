name: CI

# DIST-03: every push is a clean-clone build on a machine that has only the
# prerequisites listed in README.md. The commands below are the README's
# "Building from source" commands, in the same order.

# A PR branch runs once, on pull_request; push only covers main itself.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/desktop/package-lock.json
            packages/sidecar/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: npm --prefix packages/sidecar ci

      - run: npm --prefix packages/desktop ci

      # Staging MUST precede every cargo step. tauri_build::build() fails the
      # whole workspace build when a bundle.externalBin file is missing, so a
      # fresh clone cannot even `cargo test` until the three
      # binaries/flywheel-* files exist.
      - run: npm --prefix packages/sidecar run build:dist

      - run: npm --prefix packages/sidecar test

      - run: cargo build --workspace

      # The offline UAT (docs/mvp-spec.md §9): zero tokens, no `claude` binary, no credentials. The
      # job holds no secret. Needs packages/sidecar/dist (build:dist above) and the uat_session_env,
      # uat_fleet_ops, uat_fanout_ops and flywheel-shim binaries (cargo build --workspace above).
      # A SKIP exits 3, so it fails this step rather than passing silently.
      - name: Offline UAT (harness-supervision-gate, uat-12, uat-13)
        run: |
          node scripts/uat/harness-supervision-gate.mjs --mode=supervised
          node scripts/uat/harness-supervision-gate.mjs --mode=unsupervised
          node scripts/uat/uat-12-fleet-live-reads.mjs
          node scripts/uat/uat-13-fan-out-live.mjs

      - run: cargo test --workspace

      - run: npm --prefix packages/desktop test

      - run: npm --prefix packages/desktop run build

      # Unsigned (D-185).
      - run: npm --prefix packages/desktop run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: flywheel-dmg
          path: target/release/bundle/dmg/*.dmg
          retention-days: 7
