name: CI

# DIST-03: every push is a clean-clone build on a machine that has only the prerequisites listed in
# README.md. The README's "Building from source" commands are all here, spread over parallel jobs
# (#144): each job does only the part of the build its own checks need, so the slowest job, not the
# sum of them, sets the wall-clock time.

# `next` is where every change arrives: the private monorepo's flywheel/ is this repository's
# source of truth, and its export pushes each change there, never to `main`. A green run on `next`
# fast-forwards `main` to the commit it tested (the `promote` job at the end), so `main` only ever
# holds commits this workflow passed. A pull request runs once, on pull_request; it is not merged
# here but imported into the source of truth, which is why there is no merge_group trigger any more.
# `main` is not a push trigger: every commit reaching it was tested on `next` minutes before, so a
# second run there would spend 25 macOS minutes and the five-job macOS concurrency on a repeat.
on:
  push:
    branches: [next]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every action is pinned to a full commit SHA with its version beside it: a tag is a pointer its
# owner can move, and this file is edited in a private repository whose checks refuse a tag pin.

# macOS 15, not 14, wherever macOS is used: Playwright pins macOS 14 to a frozen WebKit build
# (revision 2251, browsers.json's `mac14` override) that its current driver could not connect to, so
# the browser arm timed out there (#119). The Rust workspace, the sidecar and the UAT stay on macOS
# because the product is macOS-only today: stage-runtime.mjs stages darwin Node builds only, the
# Tauri crate needs WebKit, and tests touch the Keychain and macOS process behaviour.
jobs:
  rust:
    name: Rust workspace tests
    runs-on: macos-15
    # Bounded: observed p90 4.2 min, max 6.6.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/sidecar/package-lock.json

      # The action installs the minimal profile, which has no clippy.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # 2026-10-16, the stable branch (it has no release tags)
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest

      # tauri_build::build() fails the whole workspace build when a bundle.externalBin file is
      # missing, and no Rust test runs those three files: they are only copied into the bundle.
      # Empty stand-ins let this job skip the release shim build and the Node download; the real
      # staging (npm run build:dist) runs in the sidecar job, and the bundle in the dmg job.
      - name: Stand-in externalBin files
        run: |
          triple=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p packages/desktop/src-tauri/binaries packages/desktop/src-tauri/resources/sidecar
          for bin in flywheel-sidecar flywheel-node flywheel-shim; do
            touch "packages/desktop/src-tauri/binaries/$bin-$triple"
          done

      # Every crate and target, tests included, warnings refused. Before the tests: a lint fails in
      # a minute, and it needs the stand-ins above (the desktop crate's build script) but not the
      # sidecar build.
      # Formatting: the workspace is rustfmt's default style since one mechanical reformat;
      # this keeps it there. Seconds, and it needs nothing built.
      - name: Format
        run: cargo fmt --all --check

      # Its own target directory: tauri-build copies the externalBin stand-ins into the target
      # directory, where the sidecar's shim tests would find an empty file instead of the shim.
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
        env:
          CARGO_TARGET_DIR: target/clippy

      # packages/sidecar/dist: the session tests spawn the real sidecar under node.
      - run: npm --prefix packages/sidecar ci

      - run: npm --prefix packages/sidecar run build

      # nextest, not `cargo test`: one process per test, so the ~90 test binaries run side by side
      # rather than one after another. .config/nextest.toml holds the one binary whose tests share
      # something outside the process (the Keychain item) to one at a time.
      - run: cargo nextest run --workspace --profile ci

      # nextest does not run doctests.
      - run: cargo test --workspace --doc

  sidecar:
    name: Sidecar build and tests
    runs-on: macos-15
    # Bounded: observed p90 2.0 min, max 6.6.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/sidecar/package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # 2026-10-16, the stable branch (it has no release tags)

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - run: npm --prefix packages/sidecar ci

      # The bundle staging: the checksum-verified Node runtime, the release flywheel-shim and the
      # launcher. push-approval.test.mjs drives that compiled shim.
      - run: npm --prefix packages/sidecar run build:dist

      - run: npm --prefix packages/sidecar test

  uat:
    name: Offline UAT
    runs-on: macos-15
    # Bounded: observed p90 2.3 min, max 4.3.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/sidecar/package-lock.json

      # The exit-test script (docs/mvp-spec.md §1, #176): plain Node over committed fixtures, no build.
      - name: Exit-test script tests
        run: node --test scripts/exit-test/test/*.test.mjs

      # The release body's extraction from CHANGELOG.md (release.yml's notes step): plain Node.
      - name: Release script tests
        run: node --test scripts/release/test/*.test.mjs

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # 2026-10-16, the stable branch (it has no release tags)

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - run: npm --prefix packages/sidecar ci

      # packages/sidecar/dist.
      - run: npm --prefix packages/sidecar run build

      # The uat_session_env, uat_fleet_ops, uat_roadmap_ops, uat_shaping_ops and uat_review_ops harness binaries and flywheel-shim. Not the desktop
      # crate, so no externalBin staging is needed here.
      - run: cargo build -p flywheel-core -p flywheel-shim

      # The offline UAT (docs/mvp-spec.md §9): zero tokens, no `claude` binary, no credentials. The
      # job holds no secret. A SKIP exits 3, so it fails this step rather than passing silently.
      - name: Offline UAT (harness-supervision-gate, uat-12, uat-16, uat-17, uat-18, uat-19)
        run: |
          node scripts/uat/harness-supervision-gate.mjs --mode=supervised
          node scripts/uat/harness-supervision-gate.mjs --mode=unsupervised
          node scripts/uat/uat-12-fleet-live-reads.mjs
          node scripts/uat/uat-16-epic-shaping.mjs
          node scripts/uat/uat-17-roadmap-round.mjs
          node scripts/uat/uat-18-execution-proposals.mjs
          node scripts/uat/uat-19-board-and-review.mjs

  desktop:
    name: Desktop unit tests and build
    # jsdom and the Vite build need nothing from macOS.
    runs-on: ubuntu-latest
    # Bounded: observed p90 2.5 min, max 2.6.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/desktop/package-lock.json

      - run: npm --prefix packages/desktop ci

      - name: Format (Prettier)
        run: npm --prefix packages/desktop run format:check

      - run: npm --prefix packages/desktop test

      - run: npm --prefix packages/desktop run build

      # THE WORKFLOWS THEMSELVES, where they run: zizmor's security audits (template injection,
      # permissions, persisted credentials, cache poisoning) and actionlint's schema checks, each
      # at an exact version. The private source of truth runs both before every export; this copy
      # covers a pull request opened here. A finding that is a deliberate design carries a
      # `# zizmor: ignore[...]` at its line with the reason above it. actionlint's shellcheck pass
      # is off here (`-shellcheck=`) because the runner's shellcheck is not pinned; the source of
      # truth runs it with a pinned one.
      - name: Lint the workflows (zizmor, actionlint)
        run: |
          pipx run zizmor==1.31.1 --offline --quiet .github/workflows
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -oneline .github/workflows/*.yml

  browser:
    name: Desktop browser tests
    runs-on: macos-15
    # Bounded: observed p90 10.4 min, max 13.8 green; it hung 33 min on 2026-10-27.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/desktop/package-lock.json

      - run: npm --prefix packages/desktop ci

      # The desktop browser arm (vitest.browser*.config.ts): layout, containment and colour measured in
      # a real engine, which jsdom cannot do. WebKit because the macOS shell renders in WKWebView; this
      # runner is macOS, so Playwright's WebKit needs no system packages (no --with-deps). The browser
      # build is cached on the exact Playwright version from the lockfile.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./packages/desktop/node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-webkit-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      # Chromium (headless shell only) for the forced-colors arm: forced colors is a Windows mechanism, the Windows
      # shell is WebView2, and WebKit reports the media query but substitutes nothing (see that config's header).
      - run: packages/desktop/node_modules/.bin/playwright install webkit chromium --only-shell

      # Light, dark, reduced motion and forced colors: each a separate Playwright context (see each config's header).
      - name: Desktop browser tests (WebKit; forced colors in Chromium)
        run: |
          npm --prefix packages/desktop run test:browser
          npm --prefix packages/desktop run test:browser:dark
          npm --prefix packages/desktop run test:browser:motion
          npm --prefix packages/desktop run test:browser:forced-colors

      # The layout-defect check (#192): every screen of the critique harness at 900 × 600, 1280 × 800, 1440 × 900 and
      # 1920 × 1200, failing on a window that scrolls, an element past the window's edge, two lines of text drawn over
      # each other, or a rail or main pane short of the window's height. Light only and no screenshots; the critique
      # run (`npm run test:critique`) shoots both schemes.
      - name: Layout defects (WebKit, four window sizes)
        run: npm --prefix packages/desktop run test:layout-defects

  # Unsigned (D-185). The .dmg bundle costs 5-8 minutes and is the step that flaked, so it runs only
  # on pushes to `next`, never on pull_request runs. It is part of what has to pass before `main`
  # moves, and the fast-forward to `main` starts no run of its own, so this is the bundle's only
  # chance to fail first.
  dmg:
    name: macOS bundle (next only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/next'
    runs-on: macos-15
    # Bounded: observed p90 9.2 min, max 9.6.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/desktop/package-lock.json
            packages/sidecar/package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # 2026-10-16, the stable branch (it has no release tags)

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - run: npm --prefix packages/sidecar ci

      - run: npm --prefix packages/desktop ci

      # tauri.conf.json's beforeBuildCommand runs the sidecar's build:dist and the desktop build.
      - run: npm --prefix packages/desktop run tauri build

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flywheel-dmg
          path: target/release/bundle/dmg/*.dmg
          retention-days: 7

  # The one check the ruleset on main requires. It runs whatever happened above (`always()`), and
  # passes only when every job succeeded; the dmg job may instead be skipped, on every run but a push
  # to next. A failed, cancelled or wrongly skipped job fails `build`.
  build:
    name: build
    if: always()
    needs: [rust, sidecar, uat, desktop, browser, dmg]
    runs-on: ubuntu-latest
    # Bounded: an aggregate of `needs`: observed 0.1 min.
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          DMG_EXPECTED: ${{ github.event_name == 'push' && github.ref == 'refs/heads/next' }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(echo "$NEEDS" | jq -r 'to_entries[]
            | select(.value.result != "success")
            | select((.key == "dmg" and .value.result == "skipped" and env.DMG_EXPECTED != "true") | not)
            | .key')
          if [ -n "$failed" ]; then
            echo "::error::not passed: ${failed//$'\n'/ }"
            exit 1
          fi

  # `next` -> `main`, the tested commit and nothing else. Fast-forward only: `main` is never
  # rewritten, and a `next` that does not descend from `main` fails here rather than replacing it.
  #
  # WITH A DEPLOY KEY, AND NEITHER OF THE TWO OBVIOUS TOKENS:
  #   - GITHUB_TOKEN cannot hold the `workflows` permission, and GitHub refuses any push from it
  #     that brings a change under .github/workflows/ onto a branch, a fast-forward included. The
  #     very first promotion carries one (this file), so it would fail exactly when it matters.
  #   - The export App's key is installed on the private repository too; stored here, it would be
  #     one leaked secret away from that repository.
  #   A deploy key is write access to THIS repository and nothing else, SSH, with no workflow-file
  #   restriction. PROMOTE_DEPLOY_KEY is its private half, a secret no pull_request run receives.
  #
  # What makes the push safe is the two rulesets on `main`, held in the private repository's
  # Terraform (infra/terraform/github.tf, #550), not who pushes:
  #   - `main` binds everybody, this key and admins included, with no bypass: it requires `build`
  #     to have passed on the pushed commit, which this run just established, and forbids
  #     non-fast-forward pushes and deletion.
  #   - `main-writers` holds only the `update` rule, which refuses every push to `main` except from
  #     a deploy key (bypass `always`) or an admin (bypass by pull request). It is a separate
  #     ruleset because a bypass actor skips every rule of the ruleset it is listed in, and this
  #     key must never skip `build`.
  # A pull request rule on `main` would refuse this push, and none is needed: pull requests are
  # imported into the source of truth, not merged here.
  promote:
    name: Fast-forward main
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/next'
    runs-on: ubuntu-latest
    # Bounded: one fast-forward push: observed 0.2 min.
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 # zizmor: ignore[artipacked] the deploy key is for the promote push below
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.PROMOTE_DEPLOY_KEY }}

      - name: Fast-forward main to the tested commit
        env:
          TESTED: ${{ github.sha }}
        run: |
          git fetch --quiet origin main
          if git merge-base --is-ancestor "$TESTED" origin/main; then
            echo "main already contains $TESTED"
            exit 0
          fi
          if ! git merge-base --is-ancestor origin/main "$TESTED"; then
            echo "::error::$TESTED does not descend from main ($(git rev-parse origin/main)); refusing to rewrite main"
            exit 1
          fi
          git push origin "$TESTED:refs/heads/main"
          echo "main -> $TESTED"
