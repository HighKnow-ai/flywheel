name: CI

# DIST-03: every push is a clean-clone build on a machine that has only the
# prerequisites listed in README.md. The commands below are the README's
# "Building from source" commands, in the same order.

# A PR branch runs once, on pull_request; push only covers main itself. merge_group runs the same
# job on the merge queue's temporary branch, so queued PRs are tested together as one combination
# before any of them lands on main.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # macOS 15, not 14: Playwright pins macOS 14 to a frozen WebKit build (revision 2251, browsers.json's
    # `mac14` override) that its current driver could not connect to, so the browser arm timed out there.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/desktop/package-lock.json
            packages/sidecar/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: npm --prefix packages/sidecar ci

      - run: npm --prefix packages/desktop ci

      # Staging MUST precede every cargo step. tauri_build::build() fails the
      # whole workspace build when a bundle.externalBin file is missing, so a
      # fresh clone cannot even `cargo test` until the three
      # binaries/flywheel-* files exist.
      - run: npm --prefix packages/sidecar run build:dist

      - run: npm --prefix packages/sidecar test

      - run: cargo build --workspace

      # The offline UAT (docs/mvp-spec.md §9): zero tokens, no `claude` binary, no credentials. The
      # job holds no secret. Needs packages/sidecar/dist (build:dist above) and the uat_session_env,
      # uat_fleet_ops and flywheel-shim binaries (cargo build --workspace above).
      # A SKIP exits 3, so it fails this step rather than passing silently.
      - name: Offline UAT (harness-supervision-gate, uat-12)
        run: |
          node scripts/uat/harness-supervision-gate.mjs --mode=supervised
          node scripts/uat/harness-supervision-gate.mjs --mode=unsupervised
          node scripts/uat/uat-12-fleet-live-reads.mjs

      - run: cargo test --workspace

      - run: npm --prefix packages/desktop test

      # The desktop browser arm (vitest.browser*.config.ts): layout, containment and colour measured in
      # a real engine, which jsdom cannot do. WebKit because the macOS shell renders in WKWebView; this
      # runner is macOS, so Playwright's WebKit needs no system packages (no --with-deps). The browser
      # build is cached on the exact Playwright version from the lockfile.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./packages/desktop/node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      - run: packages/desktop/node_modules/.bin/playwright install webkit

      # Light, dark and reduced motion: each a separate Playwright context (see each config's header).
      - name: Desktop browser tests (WebKit)
        run: |
          npm --prefix packages/desktop run test:browser
          npm --prefix packages/desktop run test:browser:dark
          npm --prefix packages/desktop run test:browser:motion

      - run: npm --prefix packages/desktop run build

      # Unsigned (D-185). The .dmg bundle costs 5-8 minutes and is the step that flaked, so it runs
      # only on pushes to main, never on pull_request or merge_group runs.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm --prefix packages/desktop run tauri build

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: flywheel-dmg
          path: target/release/bundle/dmg/*.dmg
          retention-days: 7
