[package]
name = "flywheel-desktop"
version = "0.1.0"
description = "Flywheel — the desktop shell (Tauri v2 + React)"
authors = ["HighKnow"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# The modules are a library so integration tests can drive the commands (issue #220); `main.rs`
# builds the app. Named apart from the `flywheel-desktop` binary, as `create-tauri-app` does.
[lib]
name = "flywheel_desktop_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
tokio = { version = "1", features = ["process", "signal", "rt-multi-thread", "macros", "time"] }
tauri-plugin-shell = "2"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# The package is `flywheel-core` (decision 202 of the HighKnow monorepo, which names both trees'
# crates by product). A dependency literally named `core` would shadow the sysroot `core` crate in
# this crate's extern prelude and break `tauri::generate_context!()`'s unqualified `core::`
# references (E0433 "cannot find `option` in `core`"), which is why it was aliased before the
# rename; the product name now avoids the collision on its own.
flywheel-core = { path = "../../core" }
tauri-plugin-dialog = "2.7.3"
# D-181 (Phase 10 plan 10-07): OS notifications, emitted by the Rust core only. Pinned to 2.4.0 so the
# phase stays on the `tauri = "=2.11.x"` line; the window is granted nothing from this plugin (D-175).
tauri-plugin-notification = "=2.4.0"
# D-113: the Rust core's periodic git-truth tick needs a tokio runtime and `app.emit`, which
# `packages/core` (sync, no `AppHandle`) does not have — so the desktop crate, which already owns
# the tokio runtime, starts the scheduler. This adds no new package to the dependency tree:
# `tokio-cron-scheduler` 0.15.1 is already resolved in Cargo.lock via `packages/core`.
tokio-cron-scheduler = "0.15"

# [profile.release] lives at the workspace root (Cargo.toml) — Cargo ignores
# per-member profile tables and warns when they're set here.

[dev-dependencies]
tempfile = "3"
# Issue #220: `tauri::test::mock_app` gives a test the managed `AppState` a command takes as `State`.
tauri = { version = "=2.11.6", features = ["test"] }
