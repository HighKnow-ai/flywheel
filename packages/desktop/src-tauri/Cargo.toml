[package]
name = "flywheel-desktop"
version = "0.1.0"
description = "Flywheel — the desktop shell (Tauri v2 + React)"
authors = ["HighKnow"]
edition = "2021"
# The workspace's licence (LICENSE). Never published as a crate: it ships inside the app.
license = "Apache-2.0"
publish = false
# `src/bin/flywheel-headless.rs` is a second binary; the app is the one `cargo run` and `tauri dev` mean.
default-run = "flywheel-desktop"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# The modules are a library so integration tests can drive the commands (issue #220); `main.rs`
# builds the app. Named apart from the `flywheel-desktop` binary, as `create-tauri-app` does.
[lib]
name = "flywheel_desktop_lib"
path = "src/lib.rs"

# The end-to-end harness's headless core (packages/desktop/README.md, "End-to-end"). It hosts the
# command handlers on Tauri's mock runtime, so the whole library is built on it: `main.rs` does not
# run with this feature, and the app's own build, which never enables it, is untouched. The two
# optional crates below are only ever compiled for it.
[features]
headless = ["tauri/test", "tokio/net", "tokio/sync", "tokio/io-util", "tokio/io-std", "dep:tokio-tungstenite", "dep:futures-util"]

[[bin]]
name = "flywheel-headless"
path = "src/bin/flywheel-headless.rs"
# Never built by `cargo build`, `tauri build` or the release bundle, which enable no features.
required-features = ["headless"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
tokio = { version = "1", features = ["process", "signal", "rt-multi-thread", "macros", "time"] }
tauri-plugin-shell = "2"
anyhow = "1"
# The waiting-request notifier's clock (`notify.rs`) is a `jiff::Timestamp`, the type
# `flywheel_core::timestamp` reads and writes. Same features as `flywheel-core`: UTC only, so no
# time-zone database. Replaces `chrono` (RUSTSEC-2026-0543, issue #1728).
jiff = { version = "0.2", default-features = false, features = ["std"] }

# The package is `flywheel-core` (decision 202 of the HighKnow monorepo, which names both trees'
# crates by product). A dependency literally named `core` would shadow the sysroot `core` crate in
# this crate's extern prelude and break `tauri::generate_context!()`'s unqualified `core::`
# references (E0433 "cannot find `option` in `core`"), which is why it was aliased before the
# rename; the product name now avoids the collision on its own.
flywheel-core = { path = "../../core" }
# The JS half, @tauri-apps/plugin-dialog in packages/desktop/package.json, must stay on this
# minor, as @tauri-apps/api must stay on `tauri`'s: `tauri build` refuses a major.minor mismatch.
tauri-plugin-dialog = "2.8.3"
# D-181 (Phase 10 plan 10-07): OS notifications, emitted by the Rust core only. Pinned to 2.4.0, which
# requires `tauri ^2.10` and so runs on the 2.12 line; it has no JS half, so Tauri's JS/Rust minor
# check does not pair it. The window is granted nothing from this plugin (D-175).
tauri-plugin-notification = "=2.8.1"
# Only for the `headless` feature: the localhost WebSocket the end-to-end harness's browser drives.
tokio-tungstenite = { version = "0.30", optional = true }
futures-util = { version = "0.3", optional = true }

# [profile.release] lives at the workspace root (Cargo.toml) — Cargo ignores
# per-member profile tables and warns when they're set here.

[dev-dependencies]
tempfile = "3"
# `scheduler.rs`'s tests run on a paused clock, so a 5-minute fetch period is proven in no time.
tokio = { version = "1", features = ["test-util"] }
# Issue #220: `tauri::test::mock_app` gives a test the managed `AppState` a command takes as `State`.
tauri = { version = "=2.12.5", features = ["test"] }
