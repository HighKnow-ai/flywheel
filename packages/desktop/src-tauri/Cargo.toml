[package]
name = "desktop"
version = "0.1.0"
description = "Flywheel — the desktop shell (Tauri v2 + React)"
authors = ["HighKnow"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
tokio = { version = "1", features = ["process", "signal", "rt-multi-thread", "macros", "time"] }
tauri-plugin-shell = "2"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Dependency-key renamed to `flywheel_core` (not `core`): the `core` package name is kept
# for `cargo metadata`/workspace-member identity, but a dependency literally named `core`
# shadows the sysroot `core` crate in the extern prelude of this crate, which breaks
# `tauri::generate_context!()`'s internal unqualified `core::` references (verified locally
# — E0433 "cannot find `option` in `core`"). Aliasing the key sidesteps the collision while
# the underlying package (and `cargo metadata`'s workspace member) is still named `core`.
flywheel_core = { path = "../../core", package = "core" }
tauri-plugin-dialog = "2.7.3"
# D-181 (Phase 10 plan 10-07): OS notifications, emitted by the Rust core only. Pinned to 2.4.0 so the
# phase stays on `tauri = "=2.11.5"`; the window is granted nothing from this plugin (D-175).
tauri-plugin-notification = "=2.4.0"
# D-113: the Rust core's periodic git-truth tick needs a tokio runtime and `app.emit`, which
# `packages/core` (sync, no `AppHandle`) does not have — so the desktop crate, which already owns
# the tokio runtime, starts the scheduler. This adds no new package to the dependency tree:
# `tokio-cron-scheduler` 0.15.1 is already resolved in Cargo.lock via `packages/core`.
tokio-cron-scheduler = "0.15"

# [profile.release] lives at the workspace root (Cargo.toml) — Cargo ignores
# per-member profile tables and warns when they're set here.

[dev-dependencies]
tempfile = "3"
