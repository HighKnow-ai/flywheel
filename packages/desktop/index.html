      DIRECTION CONTRACT — Flight Progress Strips
      seed: 59b0beb9
      Authored per 01-UI-SPEC.md "What this section does NOT do": Impeccable's
      `shape` returns a direction and stops; this contract is authored by the
      builder at execution time, as the first child of the document body.

      THESIS:
      The board is a controller's rack, not a document. One strip per item,
      racked in order, annotated in place, its phase printed on it and changed
      by keystroke. It refuses the category default — the soft near-neutral
      list where status is a coloured word floating in whitespace.

      OWN-WORLD:
      Visual authority: air-traffic control flight progress strips — one
      annotated strip per aircraft, racked in sequence, the strip *being* the
      aircraft's state, read by a controller supervising many flights at once.
      The rack is the app's dark chrome — cool aluminium, low-chroma,
      receding: window ground, project rail, sticky band headers, detail-panel
      frame. The strip is the one light plane — a contiguous band of strip
      stock filling the content area, hairline-separated per row, so the list
      reads as one continuous racked field rather than floating cards. Strip
      stock is tinted per workflow state — five low-chroma tints in one paper
      family — but this tint is a second channel only: every strip also
      carries its printed status word and a shape glyph. Meaning never rests
      on colour alone. Annotation is the interaction grammar: editing marks a
      strip; it does not open a form. Two donations carried forward from
      declined directions: a published, always-reachable legend where no mark
      may exist undefined (Orienteering Map), and state as an illuminated
      position on a fixed track, never a word floating in space (Drum Machine
      Step Row).

      STORY:
      Signature interaction — annotating a criterion. With a strip selected,
      checking an acceptance criterion marks it in place, advances the
      strip's checked/total count, and settles — the strip is annotated,
      never replaced. Changing status re-racks that one strip into its new
      band with a single-row displacement, never a list-wide reflow. This is
      also the performance thesis: one row moves, the rack does not
      re-render.

      FIRST VIEWPORT:
      The rack fills the window: dark chrome frame, project rail at the left
      edge, and the strip field running the full height. Band headers are
      stamped rules naming each workflow state. Each strip carries, at fixed
      stops, its FLY-142 key, its title, and its annotation fields. The
      selected strip is pulled proud of the rail — the one element allowed to
      break the plane. The brand blue marks exactly one thing: the current
      position.

      FORM:
      Motion is mechanical settle and single-row displacement — one easing
      curve across the entire product, never a fade; a strip moves or it does
      not; prefers-reduced-motion removes the displacement and applies the
      state change instantly, never removing the state change itself.
      Typeface is Archivo (OFL, self-hosted variable font) — a workhorse
      grotesque with true tabular figures for the rack's columnar fields, and
      a condensed cut (the same file's wdth axis) for the stamped key and
      band headers. Icons are Lucide: uniform 2px stroke, round joins,
      outline-only. Radius is two values, never hard-coded: 2px on strip
      stock (near-square printed stock, softened just enough to avoid a hard
      digital corner) and 6px on interactive chrome (buttons, pickers, the
      command palette), preserving the rack-vs-strip material split. No
      texture is authored: the world supplies structure, rhythm and state
      language — no paper grain, no bevels, no drop shadows imitating
      physical strips (the honest risk this direction names and refuses).

      FINISH: This contract governs every board surface built in plans 01-03
      through 01-11. If a build produces horizontal status columns, the
      direction has been misread.
    -->
