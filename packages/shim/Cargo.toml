[package]
name = "flywheel-shim"
version = "0.1.0"
edition = "2021"
# The workspace's licence (LICENSE). Never published as a crate: it ships inside the app.
license = "Apache-2.0"
publish = false
description = "D-51's PATH shim binary: dispatches on argv[0], resolves the real binary by an absolute path supplied once by the supervisor, and retries git lock failures through the same policy git_at uses. Deliberately NOT named `git` at the cargo level — the entry that shadows git on PATH is created at install time (flywheel_core::shim::install_for_run), not by cargo."

[[bin]]
name = "flywheel-shim"
path = "src/main.rs"

[dependencies]
# `flywheel-core`, never a dependency named `core`, which would shadow the sysroot `core` crate
# in this crate's extern prelude (see `packages/desktop/src-tauri/Cargo.toml`).
flywheel-core = { path = "../core" }
anyhow = "1"
serde_json = "1"
# Only for the `at` timestamp field of the D-53 contention record, formatted RFC3339 to match
# every other on-disk timestamp this workspace writes (runtime_protocol.rs's `started_at`/
# `killed_at`) — not listed in the plan's own dependency triple, added because the exhaustion
# record's own JSON shape names an `at` field this crate's chrono dependency already exists to
# produce consistently.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "3"
